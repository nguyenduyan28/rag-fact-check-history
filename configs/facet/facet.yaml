paths:
  claims: data/claims/clean_dataset.json
  graph: data/outputs/graph/history_graph.json
  nodes: data/outputs/graph/graph_nodes.json
  edges: data/outputs/graph/graph_edges.json
  aliases: data/outputs/graph/entity_aliases.json
  temporal_index: data/outputs/graph/temporal_index.json
  output_dir: data/outputs/facet
  claim_facets: data/outputs/facet/claim_facets.json
  facet_matches: data/outputs/facet/facet_matches.json
  facet_evidence: data/outputs/facet/facet_evidence.json
  facet_reranked: data/outputs/facet/facet_reranked.json
  facet_verified: data/outputs/facet/facet_verified.json
  run_report: data/outputs/facet/facet_run_report.json
  eda_report: data/outputs/facet/facet_eda_report.md
  accuracy_report: data/outputs/facet/facet_accuracy_report.md

run:
  limit: 200
  seed: 42
  query_fields:
    - claim

facets:
  types:
    - person
    - organization
    - event
    - place
    - time
    - concept
    - quantity
    - action
    - result
  graph_type_map:
    person:
      - Person
    organization:
      - Organization
    event:
      - Event
    place:
      - Place
    time:
      - Time
    concept:
      - Concept

extractor:
  use_llm: false
  fallback_on_llm_error: false
  provider: openai
  model_env: OPENAI_MODEL
  default_model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 500
  request_timeout_seconds: 120
  retry_attempts: 2
  retry_sleep_seconds: 2
  batch_size: 10
  workers: 1
  checkpoint_every: 10
  max_facets_per_type: 8

matching:
  use_exact_alias: true
  use_normalized_alias: true
  use_year_index: true
  use_substring_match: false
  use_embedding_fallback: false
  min_alias_chars: 4
  max_alias_matches_per_text: 10
  max_matches_per_facet: 5

evidence:
  graph_hops: 1
  max_chunks_per_facet: 5
  max_chunks_per_claim: 12
  max_chunk_chars: 1400
  include_neighbor_relations:
    - PARTICIPATED_IN
    - OCCURRED_AT
    - LOCATED_IN
    - RELATED_TO
    - CAUSES
    - RESULTS_IN
    - BEFORE
    - AFTER

rerank:
  top_k: 8
  facet_coverage_weight: 0.45
  relation_weight: 0.25
  temporal_weight: 0.20
  text_overlap_weight: 0.10

verifier:
  provider: openai
  model_env: OPENAI_MODEL
  default_model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 450
  request_timeout_seconds: 90
  retry_attempts: 2
  retry_sleep_seconds: 2
  batch_size: 5
  batch_max_tokens_per_item: 280
  batch_top_k_evidence: 4
  batch_max_chars_per_evidence: 650
  workers: 1
  checkpoint_every: 25
  top_k_evidence: 6
  max_chars_per_evidence: 900
